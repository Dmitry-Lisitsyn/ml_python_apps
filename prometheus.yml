global:
  scrape_interval: 15s 

scrape_configs:
  - job_name: "ml_gateway"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: /metrics
    
  - job_name: 'llm_service_metrics'
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: /metrics
    

  - job_name:  "loki" 
    metrics_path:  "/metrics" 
    static_configs: 
      -  targets: [ "host.docker.internal:3100" ] 